<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TropiFish</title>
<style>
  :root { color-scheme: light dark; --tint: #0f9b8e; --bg: #ffffff; --fg: #1c1c1e; --muted: #6b6b70; --card: #f4f5f7; --line: #e3e4e8; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0e0f11; --fg: #ecedef; --muted: #9a9ba1; --card: #17181b; --line: #2a2b30; --tint: #35c9ba; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg);
    font: 17px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  .wrap { max-width: 520px; padding: 40px 24px; text-align: center; }
  .drop { width: 56px; height: 56px; color: var(--tint); }
  h1 { font-size: 34px; margin: 16px 0 4px; letter-spacing: -0.02em; }
  p { color: var(--muted); margin: 6px 0 28px; }
  .links { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }
  a { display: inline-block; text-decoration: none; color: var(--fg); background: var(--card);
    border: 1px solid var(--line); border-radius: 12px; padding: 14px 22px; font-weight: 600; }
  a:hover { border-color: var(--tint); color: var(--tint); }
</style>
</head>
<body>
  <div class="wrap">
    <svg class="drop" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2.5C12 2.5 5 10.2 5 15a7 7 0 0 0 14 0c0-4.8-7-12.5-7-12.5z"/></svg>
    <h1>TropiFish</h1>
    <p>Your aquarium's water, fish and filter — all in one place.</p>
    <div class="links">
      <a href="privacy.html">Privacy Policy</a>
      <a href="support.html">Support</a>
    </div>
  </div>
</body>
</html>
